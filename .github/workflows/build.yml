name: build

# Every push: engine tests, the browser build with its page tests, and a
# Teensy 4.1 compile of the same firmware source. Pushes to main also
# publish the page to GitHub Pages.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests, browser build, page tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler and WebAssembly linker
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Engine tests
        run: make test

      - name: Build the page
        run: make site BUILD_LABEL=${GITHUB_SHA::7}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the test browser
        working-directory: tests/page
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Page tests
        run: node tests/page/run.mjs build/site build/out

      - name: Keep the built page
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  teensy:
    name: Teensy 4.1 compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile the firmware for the Teensy 4.1
        run: pio run -d targets/teensy

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [test, teensy]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
