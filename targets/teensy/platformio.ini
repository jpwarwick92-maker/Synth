; Teensy 4.1 build of the synth firmware.
;
; It compiles exactly the same core as the browser prototype
; (every .cpp in /firmware) plus the thin wrapper in src/main.cpp.
; No panel or display hardware is assumed yet: the board takes notes over
; USB MIDI, plays over USB audio and I2S, and reports its processor load.
;
;   pio run -d targets/teensy

[platformio]
src_dir = src

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags =
    -D USB_MIDI_AUDIO_SERIAL
    -I ../../firmware
    -Wall
build_src_filter =
    +<*>
    +<../../../firmware/*.cpp>
